<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Marker-Based AR Viewer</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #0f172a;
      }
      #ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        box-sizing: border-box;
      }
      .header {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        padding: 12px 24px;
        border-radius: 999px;
        color: white;
        font-family: sans-serif;
        font-weight: bold;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        align-self: center;
      }
      .footer {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        padding: 16px;
        border-radius: 16px;
        color: #94a3b8;
        font-family: sans-serif;
        text-align: center;
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div class="header">AR Mode Active</div>
      <div class="footer">Point your camera at the Hiro Marker on your screen or printed paper to anchor the 3D model.</div>
    </div>

    <!-- AR Scene -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
      renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="laptop-model" src="/models/asus_rog_strix_scar_17_2023_g733_gaming_laptop/scene.gltf"></a-asset-item>
      </a-assets>

      <!-- The AR Marker (Hiro) -->
      <a-marker preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <!-- Scale may need to be adjusted based on the specific gltf model size. Assuming it needs to be scaled down. -->
        <a-entity 
          gltf-model="#laptop-model"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Add custom pop animation when marker is found
      const marker = document.querySelector('a-marker');
      const model = document.querySelector('a-entity[gltf-model]');
      
      marker.addEventListener('markerFound', () => {
        // Animate scale from 0 to 1.5
        model.setAttribute('animation', {
          property: 'scale',
          from: '0 0 0',
          to: '1 1 1',
          dur: 1200,
          easing: 'easeOutElastic'
        });
      });
    </script>
  </body>
</html>
